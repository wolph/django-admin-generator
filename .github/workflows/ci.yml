name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
  # Allows publish.yml to run the full test suite as a release gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per tox env that does not need the test matrix. Keeping them in a
  # matrix means a single place to add the next checker.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env: [lint, mypy, pyright, pyrefly, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          python-version: '3.13'
      - name: Install tox
        run: uv pip install '.[tox]'
      - name: Apply Ruff fixes to pull requests
        if: github.event_name == 'pull_request' && matrix.env == 'lint'
        run: tox -e ruff-fix
      - name: Run tox
        env:
          RUFF_OUTPUT_FORMAT: >-
            ${{ github.event_name == 'pull_request' && 'github' || 'full' }}
          TOX_ENV: ${{ matrix.env }}
        run: tox -e "$TOX_ENV"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: [django42, django50, django51, django52, django60, django61]
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+.
          - python-version: '3.10'
            django-version: django60
          - python-version: '3.10'
            django-version: django61
          - python-version: '3.11'
            django-version: django60
          - python-version: '3.11'
            django-version: django61
          # Django 4.2 and 5.0 do not support Python 3.13.
          - python-version: '3.13'
            django-version: django42
          - python-version: '3.13'
            django-version: django50
          # Only Django 5.2+ supports Python 3.14.
          - python-version: '3.14'
            django-version: django42
          - python-version: '3.14'
            django-version: django50
          - python-version: '3.14'
            django-version: django51
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: uv pip install '.[tox]'
      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: tox -e "py${PYTHON_VERSION//./}-${DJANGO_VERSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.django-version }}
          path: .tox/.coverage.*
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          python-version: '3.13'
      - name: Install tox
        run: uv pip install '.[tox]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: .tox
          merge-multiple: true
      - name: Combine coverage and check threshold
        run: tox -e coverage
      - name: Upload combined coverage to Coveralls
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: .tox/coverage.lcov
          format: lcov
          fail-on-error: true

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          annotations: true

  # Dependabot opens against the default branch whenever target-branch is
  # absent, and its security updates ignore target-branch entirely and always
  # use the default branch. Either route lands a commit on master, which
  # re-diverges it from develop and blocks the sync-master fast-forward on the
  # next release. Both invariants are one line of config each and neither
  # announces itself when it changes, so assert them here.
  repo-config:
    name: Repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Dependabot and the default branch both point at develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          export DEFAULT_BRANCH="$default_branch"
          uv run --no-project --with pyyaml python - <<'PY'
          import os
          import pathlib
          import sys

          import yaml

          WANTED = 'develop'
          problems: list[str] = []

          default_branch: str = os.environ['DEFAULT_BRANCH']
          if default_branch != WANTED:
              problems.append(
                  f'the default branch is {default_branch!r}, not {WANTED!r}. '
                  f'Dependabot security updates always open against the '
                  f'default branch and cannot be redirected.'
              )

          config = yaml.safe_load(
              pathlib.Path('.github/dependabot.yml').read_text()
          )
          updates: list[dict[str, object]] = config.get('updates') or []
          if not updates:
              problems.append('.github/dependabot.yml declares no updates')

          for entry in updates:
              ecosystem = entry.get('package-ecosystem', '<unnamed>')
              directory = entry.get('directory', '<unset>')
              target = entry.get('target-branch')
              if target != WANTED:
                  problems.append(
                      f'{ecosystem} in {directory} targets {target!r}, '
                      f'not {WANTED!r}'
                  )

          if problems:
              for problem in problems:
                  print(f'error: {problem}', file=sys.stderr)
              sys.exit(1)

          print(
              f'{len(updates)} Dependabot update(s) and the default branch '
              f'all point at {WANTED!r}.'
          )
          PY
