name: Publish to PyPI and GitHub releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fail the release before anything reaches PyPI. A tag that disagrees with
  # pyproject.toml used to surface only after the upload, which leaves a
  # half-finished release behind. A red preflight stops the run while
  # re-tagging is still cheap.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag matches pyproject.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n "s/^version = '\(.*\)'$/\1/p" pyproject.toml)"
          if [ "$version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml" \
              "version $project_version" >&2
            exit 1
          fi
      - name: Verify master can fast-forward to this tag
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "master has diverged from this tag; sync-master would" \
              "fail after publishing. Reconcile master first." >&2
            exit 1
          fi
      # An expired or rotated PAT would otherwise surface only in sync-master,
      # after the package is already on PyPI. This probes liveness and Contents
      # write only: the Workflows-write grant cannot be checked in advance,
      # because the rejection happens server-side at push time. Keep that
      # permission when rotating the token or sync-master fails on any release
      # whose diff touches workflow files.
      - name: Verify the SYNC_MASTER_TOKEN can push
        env:
          GH_TOKEN: ${{ secrets.SYNC_MASTER_TOKEN }}
        run: |
          push="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push')"
          if [ "$push" != 'true' ]; then
            echo "SYNC_MASTER_TOKEN is missing, expired or cannot push" >&2
            exit 1
          fi

  # Tag pushes do not trigger ci.yml on their own; run the full test
  # suite here so nothing reaches PyPI without passing tests.
  test:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- retain standard reusable-workflow syntax

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [preflight, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # skip-existing makes a tag re-push idempotent: without it a re-run
      # dies on the PyPI duplicate-file error before the release job gets a
      # second chance.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  # The GitHub release used to be a manual step and was silently skipped when
  # forgotten; create one here so a tag push publishes everywhere at once.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          --generate-notes --verify-tag

  # Keep master pointing at the latest release. Like the GitHub release, this
  # used to be a manual step and was silently skipped. A plain push refuses
  # non-fast-forward updates, so a diverged master fails this job loudly
  # instead of being overwritten.
  #
  # Uses the SYNC_MASTER_TOKEN fine-grained PAT (Contents + Workflows write)
  # because GITHUB_TOKEN is forbidden from pushing commits that touch
  # .github/workflows/, which any release including workflow changes does.
  sync-master:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only this job pushes. The token is removed by checkout's cleanup.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_MASTER_TOKEN }}
          persist-credentials: true # zizmor: ignore[artipacked] -- required for the fast-forward push, no artefacts uploaded
      # master tracks stable releases only. A pre-release tag (v3.1.0rc1) may
      # publish to PyPI, but fast-forwarding master past the latest stable
      # release would present the rc as the current state.
      - name: Fast-forward master to the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *[!0-9.]*)
              echo "Pre-release tag $GITHUB_REF_NAME, leaving master alone"
              exit 0
              ;;
          esac
          git push origin HEAD:master
