name: Publish to PyPI and GitHub releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fail the release before anything reaches PyPI. A tag that disagrees with
  # pyproject.toml used to surface only after the upload, which leaves a
  # half-finished release behind. A red preflight stops the run while
  # re-tagging is still cheap.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checking out with the deploy key means the probe below exercises the
      # exact credential sync-master will push with. A revoked or malformed key
      # fails here, before anything reaches PyPI, instead of after.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_MASTER_SSH_KEY }}
          persist-credentials: true # zizmor: ignore[artipacked] -- the probe below needs the key, no artefacts uploaded
      - name: Verify the tag matches pyproject.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n "s/^version = '\(.*\)'$/\1/p" pyproject.toml)"
          if [ "$version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml" \
              "version $project_version" >&2
            exit 1
          fi
      # --dry-run authenticates and negotiates the ref update without making
      # it, so this catches both a key that cannot push and a master that has
      # diverged. The explicit ancestor check runs first only to turn the
      # second case into a sentence rather than git's fast-forward hint.
      - name: Verify the deploy key can fast-forward master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "master has diverged from this tag, so sync-master would" \
              "fail after publishing. Reconcile master first." >&2
            exit 1
          fi
          git push --dry-run origin "HEAD:master"

  # Tag pushes do not trigger ci.yml on their own; run the full test
  # suite here so nothing reaches PyPI without passing tests.
  test:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- retain standard reusable-workflow syntax

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [preflight, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # skip-existing makes a tag re-push idempotent: without it a re-run
      # dies on the PyPI duplicate-file error before the release job gets a
      # second chance.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  # The GitHub release used to be a manual step and was silently skipped when
  # forgotten; create one here so a tag push publishes everywhere at once.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          --generate-notes --verify-tag

  # Keep master pointing at the latest release. Like the GitHub release, this
  # used to be a manual step and was silently skipped. A plain push refuses
  # non-fast-forward updates, so a diverged master fails this job loudly
  # instead of being overwritten.
  #
  # Pushes over a write-enabled SSH deploy key (SYNC_MASTER_SSH_KEY) rather
  # than GITHUB_TOKEN, which is forbidden from pushing commits that touch
  # .github/workflows/ and so would fail on any release whose diff includes a
  # workflow change. A deploy key carries no such restriction and is scoped to
  # this repository alone.
  sync-master:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only this job pushes. The key is removed by checkout's cleanup.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_MASTER_SSH_KEY }}
          persist-credentials: true # zizmor: ignore[artipacked] -- required for the fast-forward push, no artefacts uploaded
      # master tracks stable releases only. A pre-release tag (v3.1.0rc1) may
      # publish to PyPI, but fast-forwarding master past the latest stable
      # release would present the rc as the current state.
      - name: Fast-forward master to the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *[!0-9.]*)
              echo "Pre-release tag $GITHUB_REF_NAME, leaving master alone"
              exit 0
              ;;
          esac
          git push origin HEAD:master
