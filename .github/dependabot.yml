# Every entry targets develop, and the repository default branch is
# develop too. Both matter: without target-branch Dependabot opens against
# the default branch, and its security updates always use the default
# branch whatever target-branch says. A Dependabot commit landing on master
# diverges it from develop and blocks the sync-master fast-forward in
# publish.yml. The repo-config job in ci.yml fails if either drifts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    labels:
      - 'meta: CI'
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    labels:
      - 'meta: deps'
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns:
          - '*'
