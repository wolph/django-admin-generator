# Pre-commit hooks for django-admin-generator development
# Install: brew install lefthook && lefthook install
# Or: pip install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: '*.py'
      run: uv run ruff check {staged_files}
    ruff-format:
      glob: '*.py'
      run: uv run ruff format {staged_files}
      stage_fixed: true
    type-check:
      run: uv run pyrefly check
