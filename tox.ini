[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list =
    py310-django{42,50,51,52}
    py311-django{42,50,51,52}
    py312-django{42,50,51,52,60}
    py313-django{51,52,60}
    lint
    mypy
    pyright
    pyrefly
    docs
    coverage
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run tests under {basepython} with {envname}
deps =
    .[tests]
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
commands =
    pytest --basetemp={envtmpdir}/tmp --cov-report= {posargs}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}

# ── Lint ─────────────────────────────────────────────────────

[testenv:lint]
description = Lint and format-check with ruff
skip_install = true
deps = ruff>=0.15.0
commands =
    ruff check django_admin_generator test_project
    ruff format --check django_admin_generator test_project

# ── Type checking ────────────────────────────────────────────

[testenv:mypy]
description = Type-check with mypy --strict
deps = .[dev]
commands = mypy

[testenv:pyright]
description = Type-check with pyright (strict)
deps = .[dev]
commands = pyright

[testenv:pyrefly]
description = Type-check with pyrefly
deps = .[dev]
commands = pyrefly check

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build the Sphinx documentation
deps = .[docs]
changedir = docs
commands =
    sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from the test envs and enforce 100%
skip_install = true
deps = coverage>=7.0
depends =
    py310-django{42,50,51,52}
    py311-django{42,50,51,52}
    py312-django{42,50,51,52,60}
    py313-django{51,52,60}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report --fail-under=100
